    location /gambler/ {
        proxy_pass http://127.0.0.1:8006/gambler/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SCRIPT-NAME "/gambler";
        proxy_redirect off;
    }

    location /gambler/static/ {
        proxy_pass http://127.0.0.1:8006/gambler/static/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SCRIPT-NAME "/gambler/static";
    }

