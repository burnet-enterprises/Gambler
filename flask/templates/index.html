{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}
{% block content %}
<div class="container">
<h2>Hello, to select a Gambler Project please enter a title or select a project</h2>
  {{form.csrf_token }}
<form method="POST" id="GamblerNew"  enctype="multipart/form-data">
<div class="row"><p><div class="col-md-3 col-md-offset-4">{{wtf.form_field(form.gamblertitle)}} </div></p></div>

<p><input class="btn btn-primary" type="submit" value = "Start"></p>

</div>
</form>

{% endblock%}
{% block scripts %}
{{ super()}}
<script src="//code.jquery.com/ui/1.11.4/jquery-ui.js"></script>
        

<script type="text/javascript">
async function getRequest(url = '') {
    const response = await fetch(url, {
        method: 'GET',
        cache: 'no-cache'
    })
    return response.json()
}
document.addEventListener('DOMContentLoaded', function () {
    let url = document.location
    let route = "/flaskwebgui-keep-server-alive"
    let interval_request = 3 * 1000 //sec
    function keep_alive_server() {
        getRequest(url + route)
            .then(data => console.log(data))
    }
    setInterval(keep_alive_server, interval_request)()
})
</script>
{% endblock %}
