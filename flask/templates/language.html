{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}
{% block content %}
<div class="container">
<h2 text-align:center;>Hello, please select the language.</h2>
  {{form.csrf_token }}
<form method="POST" id="GamblerNew" action="" enctype="multipart/form-data">
<div class="row"><p><div class="col-md-3 col-md-offset-4">{{wtf.form_field(form.languageselect)}} </div></p></div>
<input type="hidden" name="docreferal" id="docrefer" value=""> </input>
<p><input class="btn btn-primary" type="submit" value = "Change"></p>

</div>
</form>

{% endblock%}
{% block scripts %}
{{ super()}}
<script type="text/javascript">
if (document.referrer.indexOf(location.protocol + "//" + location.host) === 0){
document.getElementById("docrefer").value=document.referrer.split("//").pop();
console.log(document.referrer.split("//").pop());
}
else{
document.getElementById("docrefer").value="outside";
}
</script>
{% endblock %}
